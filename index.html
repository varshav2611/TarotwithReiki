}details.where p{margin-top:6px}.prose{display:flex;flex-direction:column;gap:12px;max-width:68ch}.prose ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}</style><div class="shell"><header class="top"><div class="brand"><svg class="logo" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="23" fill="#E2EBD9"/><path d="M24 38c-8-3-12-9-12-15 0-4 3-8 8-9 2-.3 3.300.2 4 1 .7-.8 2-1.300 4-1 5 1 8 5 8 9 0 6-4 12-12 15z" fill="#6E9A72"/><path d="M24 36V20" stroke="#E2EBD9" stroke-width="2" stroke-linecap="round"/><circle cx="35" cy="12" r="4.500" fill="#E0A93A"/></svg><div><p class="bname">Learn Tarot and Reiki Inspired Self Care in 30 Days</p><p class="bsub">A gentle daily practice for reflection, breath, quiet attention, and kindness.</p></div></div><nav class="nav" aria-label="Main"><button data-act="go" data-v="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.900 4.900l2.100 2.100M17 17l2.100 2.100M4.900 19.100L7 17M17 7l2.100-2.100"/></svg>Today</button> <button data-act="go" data-v="tarot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="3" width="12" height="18" rx="2.500"/><path d="M12 8l1.200 2.600 2.800.3-2.100 1.900.6 2.800L12 14.200l-2.500 1.400.6-2.800L8 10.900l2.800-.3z"/></svg>Tarot</button> <button data-act="go" data-v="reiki"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21c-5-3-8-6.500-8-10.500C4 7 6.500 5 9 5c1.300 0 2.200.5 3 1.300.8-.8 1.700-1.300 3-1.300 2.500 0 5 2 5 5.500 0 4-3 7.500-8 10.500z"/></svg>Reiki</button> <button data-act="go" data-v="journal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11a3 3 0 013 3v13H8a3 3 0 01-3-3V4z"/><path d="M9 9h6M9 13h4"/></svg>Journal</button> <button data-act="go" data-v="journey"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M8 18h4a3 3 0 000-6h-1a3 3 0 010-6h5"/></svg>My Journey</button></nav></header><div class="prog"><p id="pText">Day 1 of 30</p><div class="bar" role="progressbar" aria-label="Days completed" aria-valuemin="0" aria-valuemax="30" aria-valuenow="0" id="pBar"><i id="pFill" style="width:0%"></i></div><p id="pDone">0 of 30 complete</p></div><div id="hist" class="histbar" hidden></div><main id="app" tabindex="-1"></main><footer><p class="tagline">Pause. Breathe. Reflect. Create good energy within you.</p><button data-act="start" data-s="0">Start here</button> <button data-act="start" data-s="4">A gentle note about this practice</button></footer></div><div id="toast" class="toast" role="status" aria-live="polite"></div><script>!function(){"use strict";var e="htw_energy_v1",t=!0;try{localStorage.setItem("htw_probe","1"),localStorage.removeItem("htw_probe")}catch(e){t=!1}var a={sound:{chime:!0,voice:!1},intro:!1,day:1,done:{},intent:{},journal:[],notes:{},favs:{},moods:{},reiki:{},prep:{},pg:[]};try{var n=localStorage.getItem(e);n&&(a=Object.assign({sound:{chime:!0,voice:!1},intro:!1,day:1,done:{},intent:{},journal:[],notes:{},favs:{},moods:{},reiki:{},prep:{},pg:[]},JSON.parse(n)))}catch(e){}function o(){try{localStorage.setItem(e,JSON.stringify(a))}catch(e){t=!1}}function i(){return Object.keys(a.done).length}function s(e){return String(e).replace(/[&<>"]/g,function(e){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[e]})}a.sound&&2===a.sound.v||(a.sound={chime:!0,voice:!(!a.sound||!a.sound.voice),v:2});var r=["0","I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII","XIII","XIV","XV","XVI","XVII","XVIII","XIX","XX","XXI"],l=[{name:"Begin gently",a:1,b:8,tarot:"The Fool through The Chariot",reiki:"Grounding, breath, intention, rest, and daily routine"},{name:"Strength and self awareness",a:9,b:15,tarot:"Strength through Temperance",reiki:"Confidence, reflection, acceptance, release, and balance"},{name:"Hope and renewal",a:16,b:22,tarot:"The Devil through The World",reiki:"Awareness, emotional care, gratitude, joy, forgiveness, and wholeness"},{name:"Bring learning into life",a:23,b:30,tarot:"The four suits of the Minor Arcana, seven cards a day",reiki:"Daily wellbeing, compassion, nature, kindness, and personal practice"}];function d(e){return e<=8?0:e<=15?1:e<=22?2:3}var h=[["Suit of Wands",["energy","creativity","action"],"the leafy wands, the warm colors, and the sunlit hills","Wands are one of the four Tarot suits. They are linked with energy, creativity, and the things that spark our interest. Many people connect them with fire.","When you meet a card from this suit, ask what you feel excited about and how you can use that energy kindly, without wearing yourself out.",["What gives me energy?","Where would I like to start something small?"]],["Suit of Cups",["feelings","relationships","imagination"],"the golden cup, the water, and the gentle blues","Cups are linked with feelings, relationships, and imagination. Many people connect them with water.","Cups cards invite us to notice what we feel and who we feel close to. All feelings are welcome, and they pass like water.",["What am I feeling right now?","Who helps me feel cared for?"]],["Suit of Swords",["thoughts","words","clarity"],"the crossed swords, the clouds, and the sun behind them","Swords are linked with thoughts, words, and clear thinking. Many people connect them with air.","Swords cards ask us to notice our thoughts and choose our words with care. A clear mind and a kind voice can go together.",["What thought keeps coming back?","What kind words could I say to myself?"]],["Suit of Pentacles",["body","home","nature"],"the golden coin, the star in its center, and the green vines","Pentacles are linked with the body, home, work, and money. Many people connect them with earth.","Pentacles cards bring us back to everyday life. Food, rest, a tidy space, and time in nature all help us feel grounded.",["What helps me feel grounded?","What practical thing would help me today?"]]],c=[["Ace","new beginnings"],["Two","balance and choice"],["Three","growth and sharing"],["Four","stability and rest"],["Five","challenge and change"],["Six","harmony and ease"],["Seven","reflection and patience"],["Eight","effort and movement"],["Nine","nearly there"],["Ten","completion"]],u=["Ace","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Page","Knight","Queen","King"],p=[{name:"Wands",element:"Fire",themes:"energy, creativity, action, and passion",art:22,cards:[["a new spark","A new spark of energy, or an idea you feel excited about."],["planning","Choosing a direction and planning what comes next."],["looking ahead","Your efforts are beginning to grow. Look ahead with hope."],["celebration","A happy pause to enjoy home, friends, and what you have built."],["a lively mix","Many ideas and voices at once. Practice sharing and listening."],["recognition","Feeling proud and supported after your effort."],["standing firm","Holding your ground kindly on what matters to you."],["swift movement","Things move quickly. Stay calm and enjoy the flow."],["resilience","You are tired but still standing. Rest, and notice how far you have come."],["a heavy load","You are carrying a lot. Ask for help and set something down."],["curious beginner","A curious, eager energy, open to trying something new."],["bold energy","An adventurous, energetic quality. Remember to slow down sometimes."],["warm confidence","A warm, confident, welcoming quality."],["inspiring leader","A guiding quality of vision and encouragement."]]},{name:"Cups",element:"Water",themes:"feelings, relationships, and imagination",art:23,cards:[["a new feeling","A fresh wave of feeling, such as love, kindness, or creativity."],["connection","A warm connection or a kind understanding between two people."],["friendship","Friends, shared joy, and celebration."],["a pause","Feeling bored or unsure. Pause and notice what is being offered."],["grief and hope","Sadness over what was lost, while good things still remain."],["fond memories","Memories, simple kindness, and the joy of sharing."],["many dreams","Many dreams and choices. Gently sort what is real from what is wishing."],["moving on","Walking away from what no longer fits your heart."],["contentment","A wish come true. Let yourself enjoy it."],["a happy home","Joyful family, home, and a full heart."],["gentle dreamer","A gentle quality, open to feelings and imagination."],["following the heart","A kind, heartfelt quality that follows the heart."],["deep compassion","A caring, intuitive, deeply compassionate quality."],["calm wisdom","A calm, emotionally wise quality."]]},{name:"Swords",element:"Air",themes:"thoughts, words, and clarity",art:24,cards:[["a clear thought","A clear thought or an honest insight."],["a hard choice","A tough choice. Pause, breathe, and listen to yourself."],["heartache","Heartache and sadness. Feelings like these need gentle care and time."],["rest","Rest and recovery. Quiet time for the mind."],["tension","Conflict or tension. Choose your moments and stay kind."],["calmer waters","Moving gently toward calmer waters."],["careful thinking","Careful planning. Be honest with yourself."],["feeling stuck","Feeling stuck. Patience, and support from others, can help the ties feel looser."],["night worries","Worry that grows at night. Share it with someone you trust."],["a chapter ends","A hard chapter, and the possibility of a gentler day ahead."],["curious mind","A curious mind that loves to ask questions."],["quick and direct","A quick, direct quality. Speak with care."],["clear and honest","A clear, honest, fair quality."],["wise words","A thoughtful quality that uses words wisely and fairly."]]},{name:"Pentacles",element:"Earth",themes:"the body, home, work, and nature",art:25,cards:[["a new chance","A new chance for health, work, or home."],["balance","Balancing many things with flexibility."],["teamwork","Teamwork and learning a skill with others."],["holding on","Holding on to what feels safe. Notice if you are holding too tightly."],["a hard season","A hard season. Reaching out for help can make it lighter."],["sharing fairly","Giving and receiving fairly, with generosity."],["patience","Patience while things grow."],["steady practice","Steady practice and care for your craft."],["comfort","Comfort and self reliance. Enjoy what you have built."],["lasting security","Lasting security, family, and a warm legacy."],["eager learner","A practical quality that loves to learn."],["steady and reliable","A steady, reliable quality that takes one step at a time."],["nurturing","A nurturing, practical quality that makes a warm home."],["generous and grounded","A generous, dependable, grounded quality."]]}],f=[];[["The Fool",["curiosity","openness","new beginnings"],"the cliff edge, the small dog, the white rose, and the bright sun","Traditionally, The Fool stands for fresh starts, trust, and a playful willingness to try. It is where the Tarot journey begins.","The Fool reminds us that we do not need to know the whole path before we begin. We can start with one small step.",["What might I be ready to begin?","What is one gentle step I can take today?"]],["The Magician",["focus","skill","intention"],"the table of four symbols, the figure of eight above the head, one hand raised and one pointing down","Traditionally, The Magician is about using what you already have. The tools on the table stand for the gifts and resources within reach.","You already hold more than you think. Pick one thing you can do today and give it your full attention.",["What strengths or tools do I already have?","Where could I give my attention today?"]],["The High Priestess",["quiet","inner knowing","listening"],"the two pillars, the veil, the moon at her feet, and the scroll in her lap","Traditionally, she stands for stillness, inner knowing, and what we sense beneath the surface.","Sometimes an answer arrives when we get quiet. Listening inward is a skill, and it grows with gentle practice.",["What do I notice when I am quiet?","What might I already know, deep down?"]],["The Empress",["nurture","comfort","growth"],"the wheat, the flowing water, the crown of stars, and the soft cushions","Traditionally, The Empress is about care, growth, creativity, and enjoying the senses.","Caring for yourself is not selfish. Rest, good food, and beauty help everything else in life grow.",["What helps me feel nurtured?","What could I give a little more care this week?"]],["The Emperor",["structure","steadiness","boundaries"],"the stone throne, the mountains, the red robe, and the golden orb","Traditionally, The Emperor stands for order, stability, and steady leadership.","A little structure can feel like a safe home. Simple routines and kind boundaries give your energy somewhere to rest.",["What routine makes me feel steady?","Where could a kind boundary help me?"]],["The Hierophant",["learning","tradition","shared wisdom"],"the two pillars, the raised hand, the two figures listening, and the crossed keys","Traditionally, The Hierophant is about teaching, tradition, and learning from others.","We learn from people who came before us, and we also choose what feels true for us. Both can live together.",["Who has taught me something I value?","What do I want to keep, and what do I want to make my own?"]],["The Lovers",["connection","choice","harmony"],"the two figures, the angel above, the tree behind each, and the mountain in the middle","Traditionally, The Lovers is about close connection and choices made from the heart.","This card invites us to choose what matches our values. Connection starts with being honest and kind, with others and with ourselves.",["What matters most to me right now?","What choice would feel true to my heart?"]],["The Chariot",["direction","focus","determination"],"the canopy of stars, the two animals, the wheels, and the city behind","Traditionally, The Chariot stands for moving forward with focus and balancing two pulls with steady will.","Progress does not need to be fast. A steady direction and calm hands on the reins are enough.",["What direction do I want to move in?","What helps me stay steady?"]],["Strength",["gentle courage","patience","compassion"],"the lion, the gentle hand, the flower wreath, and the figure of eight","Traditionally, Strength shows courage that is soft, patient, and kind rather than forceful.","Real strength can be quiet. You can meet big feelings with patience, the way you would calm a good friend.",["Where could I use a little more patience with myself?","What does quiet courage look like for me?"]],["The Hermit",["reflection","solitude","inner light"],"the lantern, the snowy peak, the staff, and the grey cloak","Traditionally, The Hermit is about taking time alone to reflect and find your own light.","A quiet pause can help you see your next step. You can carry your own light, even when the path is dim.",["What do I need some quiet time to think about?","What small light can guide me today?"]],["Wheel of Fortune",["change","cycles","acceptance"],"the large wheel, the symbols around it, the clouds, and the turning colors","Traditionally, this card is about cycles, turning points, and the way life keeps moving.","Seasons change in nature and in us. When something turns, we can breathe, adjust, and take the next small step.",["What is changing in my life right now?","What stays steady for me when things move?"]],["Justice",["fairness","honesty","clarity"],"the scales, the sword, the red robe, and the pillars","Traditionally, Justice is about balance, truth, and fair choices.","Being fair includes being fair to yourself. Look at the situation clearly, with kindness, and choose what feels right.",["Where do I want more clarity?","How can I be fair and kind to myself today?"]],["The Hanged Man",["pause","a new view","letting go"],"the tree, the calm face, the golden halo, and the upside down view","Traditionally, this card is about pausing and seeing things from a new angle.","Sometimes the most helpful thing is to stop pushing and look differently. A pause is not a failure. It can bring fresh sight.",["What would I see if I looked from another side?","What could I pause on, just for today?"]],["Death",["endings","release","new beginnings"],"the white flower, the sun rising between the towers, and the quiet river","Traditionally, this card is not about physical death. It is about endings, change, and making space for something new.","Letting go can be gentle. When something has finished, it leaves room for the next thing to begin. Notice the sun rising in the picture.",["What is ready to be released?","What might grow in the space it leaves?"]],["Temperance",["balance","patience","blending"],"the two cups, the flowing water, the golden wings, and the path to the mountains","Traditionally, Temperance is about balance, moderation, and blending different parts of life.","Balance is a gentle practice. Small adjustments, like a little more rest or a little less rush, add up over time.",["Where do I feel out of balance?","What small adjustment would help?"]],["The Devil",["awareness","habits","freedom"],"the loose chains, the shadowy figure, the two small figures, and the open door of light","Traditionally, this card is about the habits, worries, or beliefs that can feel like they hold us. In the picture, the chains hang loosely, which invites us to wonder what holds us and what support could help.","Noticing what feels restrictive can be a first step. Support, time, and practical help can make change more possible, and you deserve all three.",["What habit or thought feels heavy lately?","What would feel lighter?"]],["The Tower",["sudden change","honesty","clearing"],"the tower, the bolt of light, the falling crown, and the glow in the windows","Traditionally, The Tower is about unexpected change that shakes up what was not stable. It can also be read as a truth that changes how we see a situation.","When life feels unsettled, focus on what helps you feel supported and safe in the present. Breathe, rest, and take one manageable step.",["What helps me feel safe when things change?","Who or what can support me right now?"]],["The Star",["hope","renewal","comfort"],"the large star, the seven small stars, the water, and the kneeling figure","Traditionally, The Star is about hope, calm, and renewal after a hard time.","Hope can be quiet and steady, like starlight. You do not have to feel perfect to deserve it.",["What gives me hope?","What am I grateful for right now?"]],["The Moon",["dreams","feelings","the unknown"],"the moon, the two towers, the winding path, the two animals, and the pool","Traditionally, The Moon is about dreams, feelings, and things we cannot see clearly yet.","Not everything needs to be figured out tonight. When things feel unclear, rest, and take the path one step at a time.",["What feels unclear right now?","What would help me feel safe and rested tonight?"]],["The Sun",["joy","warmth","simple happiness"],"the big sun, the sunflowers, the child, and the red banner","Traditionally, The Sun is about joy, warmth, and simple happiness.","Joy can be small. A warm drink, a laugh, or a patch of sunlight all count. Let yourself enjoy them.",["What brings me simple joy?","How can I share some warmth today?"]],["Judgement",["awakening","forgiveness","a fresh start"],"the angel with the horn, the clouds, and the figures reaching up","Traditionally, Judgement is about hearing an inner call, forgiving, and stepping into a new chapter.","Forgiveness, for others and for yourself, can lighten the load for some people, and it can take time. You can look back with kindness and move at your own pace. Some decks spell this card “Judgment.”",["What am I ready to forgive?","What new chapter is calling me?"]],["The World",["wholeness","completion","celebration"],"the wreath, the dancing figure, the four corners, and the ribbons","Traditionally, The World is about completing a cycle and feeling whole.","You have come a long way. Celebrate what you have learned, and notice that every ending is also a beginning.",["What have I learned on this journey?","What would I like to carry forward?"]]].forEach(function(e,t){f.push({kind:"card",name:e[0],tag:r[t],label:"Major Arcana "+r[t],keys:e[1],look:e[2],meaning:e[3],learn:e[4],ask:e[5]})});for(var y=0;y<8;y++)(function(e){var t=Math.floor(e/2),a=e%2,n=h[t],o=p[t].name,i={kind:"topic",name:o+(a?", Eight to King":", Ace to Seven"),tag:String(23+e),label:"Minor Arcana, "+o+(a?" part 2":" part 1"),keys:n[1],look:n[2],meaning:n[3]+(a?" Today you meet the Eight, Nine, and Ten, then the Page, Knight, Queen, and King.":" Today you meet the Ace through the Seven."),learn:n[4]+(a?" A Court card can represent a person, an energy, a role, or a quality you are being invited to develop. It does not describe anyone’s gender or age. Pages are often curious, Knights energetic, Queens caring, and Kings steady.":" Each number tells a small story, from the Ace, a new beginning, onward."),ask:n[5],suit:t,from:7*a,to:7*a+6};7===e&&(i.tips=["Choose a time of day that feels easy.","Draw one card and look at it quietly for one minute.","Write a few words in your journal.","Finish with one small kind action."]),f.push(i)})(y);function m(e){if(void 0===e.suit)return"";var t=p[e.suit];return'<section class="card sage"><h2>Today’s seven cards</h2><p class="soft">These days are a gentle introduction, not a memorization test. Choose one or two cards that stand out to you. You do not need to remember every meani ess."],"Say one kind thing to yourself in the mirror.","Where could I use more patience with myself?","Quiet strength grows each time you show up. Well done."],["Time to Reflect","I give myself time to reflect, and I carry my own light.","Inner Light","knees",["May I find stillness.","May my own light guide me.","May I rest in the quiet."],"Take a short walk on your own, or sit by a window with a warm drink.","What do I want to understand a little better?","A quiet moment of reflection is time well spent."],["Flow With Change","I can accept what I cannot change and take the next small step.","Acceptance","lap",["May I flow with change.","May I accept this moment.","May I trust the next step."],"Notice something that changes in nature today, like the clouds, the light, or the leaves.","What is changing in my life, and how do I feel about it?","You practiced accepting what is. That takes real heart."],["Honest and Kind","I look at things clearly, with fairness and kindness.","Clear and Fair","abdomen",["May I see clearly.","May I be fair to myself.","May I choose what feels right."],"Tidy one small space so it feels clear and calm.","Where do I want more clarity?","Clarity grows with quiet time. You gave yourself some today."],["Pause and See Anew","I allow myself to pause and look at things differently.","The Gentle Pause","knees",["May I pause without guilt.","May I see with fresh eyes.","May I soften my grip."],"Do one thing a little differently today, like a new route or a new seat.","What would I notice if I looked from another side?","A pause can be powerful. Thank you for taking yours."],["Release and Renew","I let go gently and make room for something new.","Gentle Release","lap",["May I release what I no longer need.","May I make room for new things.","May I stay open to new beginnings."],"Clear away one small thing, like a drawer, an old message, or a worry written on paper.","What am I ready to release?","Letting go takes courage. You were gentle with yourself today."],["Find Your Balance","I blend rest and effort in a way that feels kind.","Balance and Flow","heartAbdomen",["May my life feel balanced.","May I rest and move with ease.","May I do enough, and may that be enough."],"Drink a glass of water and stretch gently for two minutes.","Where do I feel out of balance, and what small change would help?","You are halfway there. Your gentle practice is becoming part of your days."],["Notice and Loosen","I notice what feels heavy, and I look for the small choices I do have.","Awareness","shoulders",["May I notice with kindness.","May I loosen what feels tight.","May I notice the choices I do have."],"If it feels right, take a short break from one habit that drains you, even for just one hour.","What habit or thought feels heavy lately, and what would feel lighter?","Noticing is brave. You looked with kindness today."],["Be Gentle in Change","When things shake, I breathe and take one small step.","Steadying Breath","heartAbdomen",["May I feel safe.","May I be gentle with myself.","May I take one step at a time."],"Reach out to someone you trust and tell them how you feel, or write your feelings down.","What helps me feel safe when things change?","You cared for your feelings today. That is real strength."],["Hope and Gratitude","Hope is steady, and I let it grow.","Starlight","heart",["May I feel hopeful.","May I notice what is good.","May I be grateful for this moment."],"Write down three things you are grateful for.","What am I grateful for right now?","Gratitude is like starlight. Thank you for noticing it today."],["Rest and Trust","I do not need all the answers tonight.","Evening Calm","abdomen",["May I rest easily.","May my worries soften.","May I trust the morning."],"Plan a calm evening: dim the lights and put your phone away a little earlier.","What would help me feel safe and rested tonight?","Rest is part of the journey. Sleep well when you can."],["Make Room for Joy","I welcome simple joy today.","Warm Light  is allowed. Thank you for listening to yours."],["Look Back With Kindness","I honor how far I have come.","Gratitude Practice","heart",["May I appreciate my effort.","May I carry these lessons with me.","May I be proud of showing up."],"Read back through your journal and mark one line you want to remember.","What has been my favorite moment of this journey?","Looking back shows how much you have grown."],["Calm Thinking","I can notice my thoughts without believing every one.","Clear Mind","shoulders",["May my mind feel calm.","May I speak kindly.","May my thoughts be gentle."],"Write a worry on paper, then write one kind response to it.","What thought would I like to soften today?","A calmer mind begins with noticing. You did that today."],["Your Own Card Practice","I trust myself to notice what I notice.","Your Own Practice","heartAbdomen",["May I trust my own way.","May I keep it simple.","May I enjoy my practice."],"Draw one card, look at it quietly, and write a few words.","What did I notice in the card I drew?","You can now create your own quiet reflection practice. That is wonderful."],["Ground in Nature","I come back to my body and the earth.","Earth and Body","knees",["May I feel grounded.","May my body feel cared for.","May I feel connected to the earth."],"Spend ten minutes near a window or outdoors if you can. Notice the sky, a tree, a plant, or another natural detail around you.","What did I notice in nature today?","Time outdoors can be a gentle way to reconnect with your surroundings. Thank you for visiting it."],["Share Your Energy","I carry calm and kindness into the world.","Sharing Good Energy","heart",["May I be peaceful.","May my kindness reach others.","May the world feel more peace."],"Choose one way to keep your practice going, and one kind act for someone else.","How will I keep this practice in my days?","You finished all thirty days. You showed up, and that made a difference. One quiet moment. One kind thought. One positive step."]].map(fu arn together, with an open mind."],[34,100,"Two pillars","Tradition and structure that support learning."]],[[100,88,"The angel","The angel is often read as a guiding or blessing presence over the choice."],[36,166,"The tree and the serpent","Temptation and curiosity, and the lessons they bring."],[164,160,"The tree of flames","Passion and warmth."],[100,176,"The mountain","A shared goal between the two."],[100,48,"The sun","Clear light and honesty."]],[[100,84,"The starry canopy","Guidance from above, and a bigger purpose."],[42,230,"The black and white sphinxes","Two opposite pulls. The driver steers by will, not by force."],[100,152,"The armor and crown","Protection, confidence, and focus."],[30,140,"The city and river","Home and the path behind you."],[100,200,"The chariot","Moving forward steadily."]],[[100,52,"The figure of eight","The figure of eight can suggest calm, steady energy."],[138,206,"The lion","Big feelings and instincts, met with gentleness."],[130,234,"The gentle hands","Kindness works better than force."],[84,170,"The flower wreath","Joy and natural beauty."],[84,214,"The white robe","A pure, peaceful heart."]],[[134,190,"The lantern with a star","Your own inner light to guide the next step."],[70,170,"The staff","Support and wisdom gathered over time."],[140,134,"The snowy peak","A high view, reached by going slowly."],[96,222,"The grey cloak","Quiet, privacy, and calm."]],[[100,128,"The great wheel","Often read as life moving in cycles, with ups and downs."],[100,64,"The sphinx on top","Balance and wisdom at the center of change."],[52,168,"The serpent","Change and learning, falling and rising."],[150,172,"The jackal figure","Moving through the ups and downs."],[26,34,"The four winged creatures","Often read as four steady companions, one in each corner."]],[[124,100,"The sword","Clear thinking and honest truth."],[76,150,"The scales","Weighing things fairly, with kindness."],[100,168,"The crown","Calm authority and fair decisions."],[30,120,"P
